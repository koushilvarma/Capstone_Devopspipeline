apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-demo
  namespace: default

  labels:
    app: devops-demo
    version: "1.0.0"
    tier: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-demo

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: devops-demo
        version: "1.0.0"

    spec:
      containers:
        - name: devops-demo

          image: devops-demo:1.0
          imagePullPolicy: IfNotPresent  # Use locally cached image (Docker Desktop K8s)

          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: "production"

            - name: PORT
              value: "3000"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      securityContext:
        fsGroup: 1001

---
apiVersion: v1
kind: Service
metadata:
  name: devops-demo-svc
  namespace: default
  labels:
    app: devops-demo
spec:
  type: LoadBalancer
  selector:
    app: devops-demo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
